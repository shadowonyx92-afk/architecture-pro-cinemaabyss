name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: 
      - "**"
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/proxy-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- QEMU для сборки arm64 ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # --- Buildx builder с поддержкой multi-arch ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create multi-arch builder
        run: |
          docker buildx create --name multiarch-builder --use
          docker buildx inspect --bootstrap

      # --- Авторизация в GHCR ---
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Тесты через docker-compose ---
      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          sleep 45

      - name: Run API tests in Docker container
        run: docker compose run --rm tests

      - name: Shutdown Docker Compose
        if: always()
        run: docker compose down -v

      # --- Сборка и пуш Monolith ---
      - name: Build and push Monolith Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/monolith:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Сборка и пуш Movies Service ---
      - name: Build and push Movies Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/movies-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Сборка и пуш Events Service ---
      - name: Build and push Events Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/events-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Сборка и пуш Proxy Service ---
      - name: Build and push Proxy Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/proxy-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max